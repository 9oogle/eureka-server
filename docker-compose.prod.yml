# prod: 2-node HA 페어링
# VM1: SPRING_PROFILES_ACTIVE=eureka1, HOSTNAME1=<vm1-ip>, HOSTNAME2=<vm2-ip>
# VM2: SPRING_PROFILES_ACTIVE=eureka2, HOSTNAME1=<vm1-ip>, HOSTNAME2=<vm2-ip>
services:
  eureka-server:
    image: asia-northeast3-docker.pkg.dev/melodic-crane-494802-u3/goggles/eureka-server:${IMAGE_TAG:-latest}
    container_name: goggles-eureka-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-9001}:${SERVER_PORT:-9001}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}   # eureka1 or eureka2
      SERVER_PORT: ${SERVER_PORT:-9001}
      hostname1: ${HOSTNAME1}   # eureka-server application.yaml 의 ${hostname1} 참조
      hostname2: ${HOSTNAME2}   # eureka-server application.yaml 의 ${hostname2} 참조
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT:-9001}/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
